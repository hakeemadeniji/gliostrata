[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gliostrata"
version = "0.1.0"
description = "Patient-specific computational framework for optimizing stem-cell-delivered therapy in glioblastoma"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "GlioStrata Project"}]
keywords = ["glioblastoma", "stem-cell therapy", "Bayesian optimization", "multi-omics", "survival prediction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "pyarrow>=14.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "black>=23.0", "ruff>=0.1", "mypy>=1.5"]
heavy = [
    "scanpy>=1.9",
    "anndata>=0.9",
    "lifelines>=0.27",
    "scikit-survival>=0.22",
    "botorch>=0.8",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]
workflow = ["snakemake>=7.0", "dvc>=3.0"]

[project.scripts]
gliostrata = "gliostrata.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "heavy: marks tests that require heavy optional dependencies",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

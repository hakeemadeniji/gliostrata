name: gliostrata
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - pyyaml>=6.0
  - click>=8.1
  - python-dotenv>=1.0
  - tqdm>=4.66
  - pyarrow>=14.0
  - joblib>=1.3
  - matplotlib>=3.7
  - seaborn>=0.12
  - pip
  - pip:
    - -e .
    - pytest>=7.4
    - pytest-cov>=4.1
    - black>=23.0
    - ruff>=0.1

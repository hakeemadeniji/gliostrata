# T4/T5 response surface, delivery module and toxicity term: every numeric parameter.
#
# Registered by pre-registration section 2.2 item 11(n). This file is the single place the
# numbers live; the module reads them and holds none of its own. At the freeze (item 11(m),
# by 2027-02-28) its SHA-256 is entered in pre-registration section 8 together with the
# survival model's, and after that it does not change.
#
# STATUS OF THIS FILE: DRAFT. Not frozen, not checksummed, and no T4 or T5 read may use it
# until the freeze amendment is entered. Three entries are marked `open: true` and are
# decisions the project lead has still to make; see `open_questions` at the foot of the file.
#
# Every entry carries:
#   value        the number the module uses
#   status       fitted_tcga | published | assumed | derived_by_rule
#   source       PMID or the fit it comes from; "none" only where status is assumed
#   range        the sensitivity range of pre-registration section 3.6 (exploratory only)
#
# Structure: docs/t4t5_model_design.md, Design A. The model is
#   S_c,i(t) = S_stupp,i(t) ^ exp(-E_i(c) + T_i(c))
#   RMST_i(c) = integral of S_c,i over [0, tau]; gain_i(c) = RMST_i(c) - RMST_i(Stupp)

schema_version: 1
registered_under: "docs/preregistration.md section 2.2 item 11 (g) to (o)"
design_document: "docs/t4t5_model_design.md (Design A)"
frozen: false

# ---------------------------------------------------------------------------------------
# Horizon and integration
# ---------------------------------------------------------------------------------------
horizon:
  tau_months:
    value: 24
    status: published          # registered, not assumed: item 11(b)
    source: "pre-registration section 2.2 item 11(b)"
    range: "fixed"
  grid_step_months:
    value: 0.1
    status: assumed
    source: "none; trapezoid rule on a fixed grid, item 11(b)"
    range: "0.05 to 0.2 (numerical check only, not a sensitivity parameter)"

# ---------------------------------------------------------------------------------------
# Survival model (L5). Variant 2: age, sex, arm. Item 11(g).
# ---------------------------------------------------------------------------------------
survival_model:
  variant: 2
  covariates: [age, sex, arm]
  estimator: "gliostrata.prediction.cox.CoxPHModel (Breslow)"
  fitted_on: "TCGA, all complete-case patients with an outcome"
  baseline_arm: "RT+TMZ"       # item 11(a): the Stupp baseline
  external_validation:
    c_index: 0.5385
    c_index_ci: [0.4994, 0.5807]
    brier_18mo: 0.2617
    verdict: FAIL
    recorded_in: "pre-registration section 2.3"
  # Item 11(g): neither IDH nor MGMT appears here or anywhere below. Item 11(l) states
  # the cost: IDH-mutant baselines are modelled as IDH-wild-type.

# ---------------------------------------------------------------------------------------
# Delivery module (L4-lite). Item 11(h). Declared uncalibrated.
# ---------------------------------------------------------------------------------------
delivery:
  calibrated: false            # item 11(h): stands whatever T3 returns
  tropism_genes:
    iPSC-NSC: [CXCL12, VEGFA, PLAU, CCL2]
    HB1_F3_line: [CXCL12, VEGFA, PLAU, CCL2]
    MSC: [TGFB1]
  tropism_reference:
    # The standardisation of the tropism score uses a frozen TCGA mean and SD, never a
    # CGGA cohort statistic, so that the sealed cohort cannot leak into the transform.
    # Scale is log2(FPKM + 1), matching CGGA's RSEM FPKM release rather than CPM. A CPM
    # reference offsets every patient's score by -1.36 SD (NSC panel) and -1.47 SD (TGFB1),
    # which alone would cut the engrafted-dose factor by about a third. Item 11(h) names no
    # normalisation, so matching the scoring cohort stays inside the registered design.
    source: "TCGA-GBM log2(FPKM + 1), 284 samples, GDC fpkm_unstranded, frozen; plus the
      modifier mean and SD (tme_immune, state_mes) over 155 TCGA patients"
    file: "configs/response_surface_v1_tropism_reference.json"
    present: true
    sha256: "b5839ad3fe29df229bc905ad65d0b9061fbce1ed612a97729a68d10326b5380a"
    built_by: "scripts/t4t5_tropism_reference.py build"
    scale_caveat: >-
      TCGA's FPKM here is GDC's STAR-derived fpkm_unstranded; CGGA's is RSEM FPKM. Both are
      length-normalised, so the first-order gene-length offset is gone, but a second-order
      pipeline difference remains. It is reported, not corrected.

  # f_k: fraction of injected cells surviving to act.
  cell_fraction_acting:
    iPSC-NSC: {value: 0.5, status: assumed, source: "none (evidence gap 1)", range: "0.1 to 1.0"}
    HB1_F3_line: {value: 0.5, status: assumed, source: "none (evidence gap 1)", range: "0.1 to 1.0"}
    MSC: {value: 0.3, status: assumed, source: "none (evidence gap 1)", range: "0.1 to 1.0"}

  # N_eff = N * f_k * logistic(a_k + g_k * z_i,k)
  tropism_logit_intercept:
    value: 0.0
    status: assumed
    source: "none"
    range: "-1 to 1"
  tropism_logit_slope_per_sd:
    value: 0.5
    status: assumed
    source: "direction only: PMID 23365134 (TGF-beta, MSC); PMID 23109183 (CXCL12, NSC, in vitro)"
    range: "0 to 1"

  # Spatial coverage: Cov(n) = 1 - exp(-n / n0)
  coverage_saturation_sites:
    value: 3.0
    status: assumed
    source: "none"
    range: "1.5 to 6"

  # Schedule factor sigma(s)
  schedule_factor:
    single: {value: 1.00, status: published, source: "reference level", range: "fixed"}
    fractionated_x2: {value: 1.10, status: assumed, source: "direction only: PMID 34944938", range: "1.0 to 1.3"}
    fractionated_x3: {value: 1.15, status: assumed, source: "direction only: PMID 34944938", range: "1.0 to 1.3"}

# ---------------------------------------------------------------------------------------
# Response surface. Item 11(i) for Emax, item 11(j) for combo.
# ---------------------------------------------------------------------------------------
response:
  # E_i(c) = Emax_p * m_p(i) * sigma(s) * Cov(n) * N_eff^h / (N_eff^h + ED50_p^h)
  dose_response:
    ed50_cells:
      value: 2.5e7
      status: assumed
      source: "clinically tested ranges 1e7 to 5e7 (PMID 27979915) and 5e7 to 1.5e8 (PMID 34214495); CAR MTD 2.5e7 (PMID 40451950)"
      range: "5e6 to 1e8"
    hill_h:
      value: 1.0
      status: assumed
      source: "none"
      range: "0.5 to 2"

  # Emax_p by the registered rule of item 11 (i.1) to (i.6):
  #   Emax_p = 0.5 * ln(ratio_p)
  #   ratio_p = the MEDIAN of the treated-to-control median-survival ratios across EVERY
  #             study qualifying under P1 to P5, not one study chosen by hand.
  # Item 11(i.7), a DISCLOSED DEVIATION from (i.3): the primary qualifying set is narrowed to
  # studies whose control arm receives no agent intended to have anti-tumour activity
  # (untreated, saline, PBS, vehicle, mock-transduced, reporter-only or empty vector). An arm
  # receiving an active therapeutic does not qualify; an uncertain one is excluded rather than
  # argued about. The test is structural -- what the control arm received -- never its result.
  # If a payload's narrowed set is empty it falls back to the literal (i.3) set, stated for
  # that payload. The literal set is reported alongside as a section 3.6 exploratory analysis.
  # Each entered value therefore carries control_arm_rule: narrowed | literal_fallback.
  # All three values are therefore pending the registered search of (i.4), which has not been
  # run. They are filled from docs/t4t5_emax_search/ and from nowhere else.
  emax:
    translation_factor:
      value: 0.5
      status: assumed
      source: "none; item 11 (i.1)"
      range: "0.25 to 1.0"

    CRAd:
      value: 0.05889151782819173                 # 0.5 * ln(1.125); hazard ratio 0.9428
      ratio_used: 1.125
      n_studies: 3
      studies: ["21629227", "21718006", "23821758"]
      control_arm_rule: narrowed
      status: derived_by_rule
      source: "item 11 (i.2) and (i.7); docs/t4t5_emax_search/emax_result.md"
      range: "hazard ratio 1.0 to 0.60"
      note: >-
        The median over 3 qualifying studies, all vehicle-controlled. Its two newly extracted
        studies give ratios of 1.125 and 1.102, so the modelled effect is close to none. That
        agrees with the null human randomised data for oncolytic adenovirus (hazard ratio
        1.06, PMID 33119048), which is reported alongside it.

    prodrug_enzyme:
      value: 0.21589120821276891                 # 0.5 * ln(1.54); hazard ratio 0.8058
      ratio_used: 1.54
      n_studies: 10
      studies: ["17409449", "22996231", "28148846", "29660022", "30257000", "31909530", "32093290", "32439343", "33463272", "35017150"]
      control_arm_rule: narrowed
      status: derived_by_rule
      source: "item 11 (i.2) and (i.7); docs/t4t5_emax_search/emax_result.md"
      range: "hazard ratio 1.0 to 0.60"
      note: >-
        The best-evidenced of the three payloads: 10 qualifying studies, with untreated,
        vehicle and reporter-vector controls. One study dropped by the (i.7) narrowing.

    CAR:
      value: 0.49500756068055496                 # 0.5 * ln(2.6912751677852347); hazard ratio 0.6096
      ratio_used: 2.6912751677852347
      n_studies: 1
      studies: ["26640245"]
      control_arm_rule: narrowed
      status: derived_by_rule
      source: "item 11 (i.2) and (i.7); docs/t4t5_emax_search/emax_result.md"
      range: "hazard ratio 1.0 to 0.70"
      note: >-
        KNOWN WEAKNESS, reported and not patched: this rests on a SINGLE study, and it is the
        largest Emax of the three. Three of CAR's four eligible studies have `uncertain`
        controls (irrelevant-specificity CAR products, or comparators the papers never
        describe). The registered rule sets no minimum n, and adding one after seeing that
        CAR's n is 1 and its Emax the largest is the change the registration exists to
        prevent. The poor human CAR evidence in glioblastoma (no efficacy in newly diagnosed
        disease, PMID 38216766; 8% objective response, PMID 40451950) is reported with every
        CAR number.

  # Patient modifier m_p(i) = exp(w_p' u_i), u_i standardised on the frozen TCGA reference.
  patient_modifier:
    immune_tme_slope_per_sd:
      value: 0.1
      status: assumed
      source: "none; sign assumed"
      range: "0 to 0.3"
      applies_to: [CRAd, CAR]          # mechanistic: the prodrug payloads do not act through the immune TME
    mes_like_slope_per_sd:
      value: 0.1
      status: assumed
      source: "none; sign assumed"
      range: "0 to 0.3"
      applies_to: [CRAd, prodrug_enzyme, CAR]
    # Standardisation: the slopes are per SD, so u is z-scored against the FROZEN TCGA
    # reference above (modifier_reference block), never against the cohort being scored.
    # Only the tropism half of that reference existed until 2026-11-28; a modifier SD taken
    # from the scoring cohort would have been the leakage the reference exists to prevent.
    standardised_against: "configs/response_surface_v1_tropism_reference.json"
    # No MGMT modifier: 5-FU and SN-38 act through antimetabolite and topoisomerase
    # mechanisms, not through MGMT (a mechanistic argument, not a measured effect).
    # No IDH modifier and no MGMT modifier anywhere: item 11(l).

  # Item 11(j): "combo" is the two payloads each carrier may carry. Item 4 excludes
  # HB1_F3_line x CAR and MSC x CRAd, so no uniform pair is possible.
  combo:
    pairs:
      iPSC-NSC: [CRAd, prodrug_enzyme]     # compatible with all three; this pairing is a declared choice
      MSC: [prodrug_enzyme, CAR]           # CRAd excluded by item 4
      HB1_F3_line: [CRAd, prodrug_enzyme]  # CAR excluded by item 4
    interaction: bliss_independence        # E_combo = (E_a + E_b) * synergy
    synergy:
      value: 1.0
      status: assumed
      source: "none"
      range: "0.8 to 1.3"

# ---------------------------------------------------------------------------------------
# Toxicity and delay. Item 11(k). The only source of harm in the model.
# ---------------------------------------------------------------------------------------
toxicity:
  # T_i(c) = tau_p * (N / dose_reference)^q * (1 + eta * (n - 1)) + delta_delay
  dose_reference_cells:
    value: 5.0e7
    status: published
    source: "the registered dose maximum (item 4)"
    range: "fixed"
  tau_payload:
    CRAd: {value: 0.02, status: assumed, source: "direction: PMID 34214495 (1 of 12 grade 3 meningitis)", range: "x0.5 to x3"}
    prodrug_enzyme: {value: 0.01, status: assumed, source: "none", range: "x0.5 to x3"}
    CAR: {value: 0.05, status: assumed, source: "direction: PMID 40451950 (56% grade 3 neurotoxicity)", range: "x0.5 to x3"}
    combo: sum_of_pair                 # item 11(j): the sum of the carrier's two payloads
  dose_exponent_q:
    value: 2.0
    status: assumed
    source: "none"
    range: "1 to 3"
  site_penalty_eta:
    value: 0.05
    status: assumed
    source: "none"
    range: "0 to 0.15"
  delay_cost_log_hr:
    value: 0.02
    status: assumed
    source: "delay of 10 to 14 days to starting Stupp, PMID 34214495"
    range: "0 to 0.08"
  # A larger CAR-derived toxicity prior was rejected as not transferable to carrier-cell
  # delivery (item 11(k)); it is the top of tau_CAR's range instead.

# ---------------------------------------------------------------------------------------
# Pre-read controls. Item 11(o). A control that misses its stated answer stops the read.
# ---------------------------------------------------------------------------------------
controls:
  no_modifier:
    description: "every patient modifier set to zero"
    must_yield: "distinct-configuration count of exactly 1"
  null_payload:
    description: "Emax = 0 for every payload"
    must_yield: >-
      benefit term E of exactly 0 for every patient and configuration, and a gain equal to
      the one the toxicity term alone implies -- negative wherever that term is positive.
      Not "gain of exactly 0": the toxicity term stays in the primary surface under item
      11(k), so a zero gain is unreachable. Corrected 2026-11-27; see section 8.
  synthetic_dry_run:
    description: "the whole pipeline on synthetic files (section 3.8)"
    must_yield: "completes, and writes a verdict of the registered shape"
  tcga_rehearsal:
    description: "the whole T4 and T5 pipeline on the held-out TCGA split, before any CGGA read"
    must_yield: "completes without error; numbers are not reported as results"

# ---------------------------------------------------------------------------------------
# Still to decide. None of these three follows mechanically from the registered rule.
# ---------------------------------------------------------------------------------------
open_questions:
  emax_values: >-
    All three Emax values are pending. The registered search of item 11(i.4) HAS been run
    (2026-11-28T01:19:52Z; 108 records, 40 carried past dual screening, log in
    docs/t4t5_emax_search/), but 37 of the 40 need full text before a ratio can be read, and
    under item 11(i.7) each surviving study also needs its control arm classified. These are
    the only values in this file that are not settled; everything else is final subject to the
    freeze. The three questions open when this file was first drafted (prodrug reporting the
    wrong quantity, CAR's "pessimistic end" shortcut, CRAd's ovarian anchor) were all resolved
    by rewriting item 11(i) before the search, so that ratio_p is a median across qualifying
    studies rather than one study chosen by hand. See pre-registration section 8.
  abstract_level_ratios_are_not_ratio_p: >-
    Eight ratios (1.21 to 2.75) are readable from abstracts alone. They are NOT ratio_p, which
    item 11(i.2) defines as the median over EVERY qualifying study, and none of the eight has
    a confirmed untreated control, so none is yet known to be in the item 11(i.7) primary set.
    They are recorded in docs/t4t5_emax_search/screening/ and must not be entered here.
  tropism_scale: >-
    RESOLVED 2026-11-27, before any T4 or T5 number existed. The reference was first built on
    TCGA log2(CPM + 1), which left a measured offset of -1.36 SD for the NSC panel and -1.47 SD
    for TGFB1 against CGGA's RSEM FPKM release -- about a third of the engrafted-dose factor,
    for every patient. Rebuilt on TCGA log2(FPKM + 1) from GDC's fpkm_unstranded column, so the
    reference and the scoring cohort share a normalisation. Item 11(h) requires a frozen TCGA
    mean and SD and names no normalisation, so this is an implementation choice inside the
    registered design, not an amendment to it. The remaining second-order difference between
    GDC's STAR-derived FPKM and CGGA's RSEM FPKM is disclosed, not corrected.
